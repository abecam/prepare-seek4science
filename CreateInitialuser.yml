---
# create_seek_admin.yml
#
# Fetches a `rails runner` script from a GitHub repo and executes it
# inside the running SEEK container, resolved dynamically through
# `docker compose ps` rather than a hardcoded container name - this
# works no matter what Compose ends up naming the container (project
# prefix, custom -p name, etc.), so it doesn't depend on setting
# `container_name` in the compose file.
#
# Requirements:
#   - The target host can reach GitHub and has the Docker Compose CLI
#     available for the SEEK stack (this play assumes it runs on the
#     same host the stack is deployed on).
#   - `seek_compose_file` points at the docker-compose.yml for the
#     stack you're targeting.
#   - Store the admin password in an Ansible Vault-encrypted var; never
#     put it in plaintext in this file or in the fetched .rb script.
#
# Usage:
#   ansible-playbook -i inventory.yml create_seek_admin.yml \
#     --ask-vault-pass \
#     -e seek_admin_password='ChangeMe123!'
#
#   (better: keep seek_admin_password in an ansible-vault encrypted
#    group_vars/host_vars file instead of passing it on the CLI)

- name: Create initial SEEK admin user via rails runner
  hosts: seek_hosts
  gather_facts: false

  vars:
    # Path to the docker-compose.yml for the stack you're targeting.
    seek_compose_file: "./docker-compose.yml"
    # The *service* name in that compose file - not a container name.
    seek_service_name: "seek"
    # Switch to "docker-compose" (hyphenated) if the host only has the
    # older standalone Compose v1 binary rather than the `docker compose`
    # plugin.
    seek_compose_cmd: "docker compose"

    seek_script_raw_url: "https://raw.githubusercontent.com/yourorg/seek-admin-scripts/main/create_admin.rb"

    seek_admin_login: "alain"
    seek_admin_email: "alain@example.org"
    seek_admin_first_name: "Alain"
    seek_admin_last_name: "Example"
    # seek_admin_password: set via --ask-vault-pass / vaulted vars file, not here

  tasks:
    - name: Resolve the running container ID for the SEEK service via Compose
      ansible.builtin.command:
        cmd: "{{ seek_compose_cmd }} -f {{ seek_compose_file }} ps -q {{ seek_service_name }}"
      register: seek_container_id
      changed_when: false

    - name: Fail early if no container was found for that service
      ansible.builtin.fail:
        msg: >-
          No running container found for service '{{ seek_service_name }}' in
          {{ seek_compose_file }}. Confirm the stack is up
          ({{ seek_compose_cmd }} -f {{ seek_compose_file }} ps) and that
          seek_service_name matches the service key in the compose file
          (not a container name).
      when: seek_container_id.stdout | trim == ""

    - name: Confirm the resolved container is actually running
      ansible.builtin.command:
        cmd: "docker inspect -f {% raw %}'{{.State.Running}}'{% endraw %} {{ seek_container_id.stdout | trim }}"
      register: seek_container_state
      changed_when: false

    - name: Fail early if the resolved container isn't running
      ansible.builtin.fail:
        msg: >-
          Container {{ seek_container_id.stdout | trim }} for service
          '{{ seek_service_name }}' is not running (state:
          {{ seek_container_state.stdout | trim }}).
      when: seek_container_state.stdout | trim != "true"

    - name: Fetch create_admin.rb from GitHub
      ansible.builtin.uri:
        url: "{{ seek_script_raw_url }}"
        return_content: true
        status_code: 200
      register: seek_admin_script

    - name: Run the script inside the container, cleaning up secrets afterwards
      vars:
        seek_container_ref: "{{ seek_container_id.stdout | trim }}"
      block:
        - name: Create a secure temp file for the env vars
          ansible.builtin.tempfile:
            state: file
            suffix: seek-admin-env
          register: seek_env_file

        - name: Write ENV vars (incl. password) to the temp file, 0600 perms
          ansible.builtin.copy:
            dest: "{{ seek_env_file.path }}"
            mode: "0600"
            content: |
              SEEK_ADMIN_LOGIN={{ seek_admin_login }}
              SEEK_ADMIN_EMAIL={{ seek_admin_email }}
              SEEK_ADMIN_FIRST_NAME={{ seek_admin_first_name }}
              SEEK_ADMIN_LAST_NAME={{ seek_admin_last_name }}
              SEEK_ADMIN_PASSWORD={{ seek_admin_password }}
          no_log: true   # this task's content/diff would contain the password

        - name: Run create_admin.rb via rails runner (script piped over stdin)
          ansible.builtin.command:
            cmd: >-
              docker exec -i
              --env-file {{ seek_env_file.path }}
              {{ seek_container_ref }} bin/rails runner -
            stdin: "{{ seek_admin_script.content }}"
          register: seek_admin_result
          changed_when: "'Created user' in seek_admin_result.stdout"
          failed_when: >-
            seek_admin_result.rc != 0 or
            'FAILED' in seek_admin_result.stdout
          # no secrets appear in this task's cmd or output, so no no_log needed
          # -> the debug task below can safely show what happened

        - name: Show script output
          ansible.builtin.debug:
            msg: "{{ seek_admin_result.stdout_lines }}"

      always:
        - name: Remove the temp env file
          ansible.builtin.file:
            path: "{{ seek_env_file.path }}"
            state: absent
          when: seek_env_file is defined and seek_env_file.path is defined